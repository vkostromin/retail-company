id: quarterly_report
question: Create a report for Q1 including insights and action items for Q2.
interpretation: >
  "Q1" = the most recent complete calendar Q1 unless the user specifies a year. A quarterly report
  needs: headline KPIs (net revenue, orders, AOV, active and new customers) vs previous quarter and
  vs the same quarter last year; top and bottom categories by growth; return rate; then 3-5
  prioritized, measurable action items for the next quarter. Run several focused queries, then
  synthesize. The KPI query below is the backbone.
sql: |
  WITH q AS (
    SELECT DATE_TRUNC(DATE(oi.created_at), QUARTER) AS quarter,
           SUM(IF(oi.status NOT IN ('Cancelled','Returned'), oi.sale_price, 0)) AS net_revenue,
           COUNT(DISTINCT oi.order_id) AS orders,
           COUNT(DISTINCT oi.user_id) AS active_customers,
           COUNTIF(oi.status = 'Returned') / COUNT(*) AS return_rate
    FROM order_items oi
    GROUP BY quarter
  )
  SELECT quarter, ROUND(net_revenue) AS net_revenue, orders,
         ROUND(net_revenue / orders, 2) AS aov, active_customers, ROUND(return_rate, 3) AS return_rate
  FROM q
  WHERE quarter >= DATE_SUB(DATE_TRUNC(CURRENT_DATE(), QUARTER), INTERVAL 6 QUARTER)
  ORDER BY quarter
report: >
  Executive summary with KPI table (QoQ and YoY), 3 insights backed by numbers (growth driver,
  weakest category, return trend) and action items with an owner and a target metric for next quarter.
tags: [report, quarterly, q1, kpi, insights, action-items, executive]
