id: monthly_revenue
question: What is our monthly revenue trend over the last 12 months?
interpretation: >
  Revenue = SUM(order_items.sale_price) excluding Cancelled and Returned items (net of returns).
  Monthly grain on the item's created_at. Also show orders and AOV so a revenue change can be
  decomposed into volume (orders) vs basket size (AOV). Exclude the current, incomplete month
  or flag it as month-to-date.
sql: |
  SELECT DATE_TRUNC(DATE(oi.created_at), MONTH) AS month,
         ROUND(SUM(oi.sale_price)) AS revenue,
         COUNT(DISTINCT oi.order_id) AS orders,
         ROUND(SUM(oi.sale_price) / COUNT(DISTINCT oi.order_id), 2) AS aov
  FROM order_items oi
  WHERE oi.status NOT IN ('Cancelled', 'Returned')
    AND oi.created_at >= TIMESTAMP(DATE_SUB(DATE_TRUNC(CURRENT_DATE(), MONTH), INTERVAL 12 MONTH))
  GROUP BY month
  ORDER BY month
report: >
  Lead with the trend over the period: first vs last complete month and the % change. Decompose the change into order volume and AOV and say which moved more. Label the current month as month-to-date and do not compare it with complete months.
eval_question: What was our monthly net revenue trend over the last 12 months?
tags: [revenue, trend, time-series, monthly, aov]
