[project]
name = "retail-agent"
version = "0.1.0"
description = "Data analysis chat agent for retail executives (LangGraph + Gemini + BigQuery)"
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
  "langgraph>=0.6,<2",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain-core>=0.3",
  "langchain-google-genai>=2.1",
  "google-cloud-bigquery>=3.25",
  "db-dtypes>=1.2",
  "pandas>=2.2",
  "sqlglot>=25",
  "pydantic>=2.7",
  "pyyaml>=6",
  "python-dotenv>=1",
  "typer>=0.12",
  "rich>=13",
  "prompt_toolkit>=3",
  "tenacity>=8.2",
  "rank-bm25>=0.2.2",
  "numpy>=1.26",
  "streamlit>=1.38",
]

[project.optional-dependencies]
langfuse = ["langfuse>=2.50"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
retail-agent = "retail_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs GCP credentials and Gemini access"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
src = ["src"]
